name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Uses the root lockfile, which npm workspaces requires to be in sync with
      # every package.json. `--ignore-scripts` keeps bcrypt's native build out of
      # the install step; nothing here needs it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint --workspace my-app

      - name: Test backend
        run: npm run test --workspace backend

      - name: Build frontend
        run: npm run build --workspace my-app

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfile in the repo is the one that builds, so a broken
      # image can never reach a deploy unnoticed.
      - name: Build image
        run: docker build -f backend/Dockerfile -t planner-api:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 3000:3000 \
            -e MONGO_URI="mongodb://127.0.0.1:27017/planner" \
            -e JWT_SECRET="ci_secret_that_is_definitely_long_enough_32" \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            planner-api:ci

          # The container should refuse to start without a database rather than
          # crash-loop silently, so only assert it is alive and listening.
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "health endpoint responded"
              docker rm -f api
              exit 0
            fi
            sleep 2
          done

          echo "::error::container did not become healthy"
          docker logs api
          docker rm -f api
          exit 1