name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Uses the root lockfile, which npm workspaces requires to be in sync with
      # every package.json. `--ignore-scripts` keeps bcrypt's native build out of
      # the install step; nothing here needs it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint --workspace my-app

      - name: Test backend
        run: npm run test --workspace backend

      - name: Build frontend
        run: npm run build --workspace my-app

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    name: Backend image builds
    runs-on: ubuntu-latest

    # server.js awaits connectDB() before app.listen(), so the image cannot serve /api/health
    # without a reachable database. Without this service the smoke test below polls a port
    # nothing ever opens and fails after 30s.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Proves the Dockerfile in the repo is the one that builds, so a broken
      # image can never reach a deploy unnoticed.
      - name: Build image
        run: docker build -f backend/Dockerfile -t planner-api:ci .

      - name: Smoke-test the container
        run: |
          # --network host is load-bearing: it puts the API container in the runner's
          # network namespace, which is where the mongo service published 27017. On the
          # default bridge, the container's 127.0.0.1 is the container itself, so
          # MONGO_URI would point at nothing and the app would exit before listening.
          docker run -d --name api --network host \
            -e MONGO_URI="mongodb://127.0.0.1:27017/planner" \
            -e JWT_SECRET="ci_secret_that_is_definitely_long_enough_32" \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            planner-api:ci

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "health endpoint responded"
              curl -fsS http://localhost:3000/api/health
              docker rm -f api
              exit 0
            fi
            sleep 2
          done

          echo "::error::container did not become healthy"
          docker logs api
          docker rm -f api
          exit 1