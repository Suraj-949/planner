# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: render blueprint launch   (or "New → Blueprint" in the dashboard)
#
# Two services: a private Node API and a static frontend. The frontend is served as
# static files, so it has no server to attack and no Node runtime to keep patched.
#
# Before the first deploy, set the values marked sync: false in the dashboard:
#   - MONGO_URI    (use Atlas or Render's own Postgres-free Mongo; not local)
#   - JWT_SECRET   (generate with the command in backend/.env.example)
#
# Note: the frontend build needs VITE_BASE_BACKEND_URL set to the API's URL. Because
# Vite inlines VITE_* variables at build time, changing it later requires a new build,
# not just a restart.

services:
  - type: web
    name: planner-api
    runtime: node
    plan: starter # 'free' does not allow the background seed job or scaling
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Render injects PORT; HOST must stay 0.0.0.0 for the proxy to reach the process.
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false # e.g. https://planner-frontend.onrender.com
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a secret; must still be >= 32 chars
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: planner-frontend
    runtime: static
    buildCommand: npm ci && npm run build --workspace my-app
    staticPublishPath: ./my-app/dist
    envVars:
      - key: VITE_BASE_BACKEND_URL
        sync: false # e.g. https://planner-api.onrender.com/api

# One-off job that populates the demo account. Trigger it from the dashboard rather
# than on every deploy, and never against a production database you care about.
#   Render dashboard → planner-seed → Run manually
jobs:
  - type: job
    name: planner-seed
    runtime: node
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_USERNAME
        value: demo
      - key: SEED_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false # change this before seeding anything real
    # Overrides the image's default command with the seed script.
    dockerCommand: node backend/src/scripts/seed.js